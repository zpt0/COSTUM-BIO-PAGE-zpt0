name: daily
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS syntax
        run: |
          node --check js/config.js
          node --check js/main.js
          for f in js/modules/*.js; do node --check "$f"; done
          node --check server.js

      - name: Refs resolve
        run: |
          missing=0
          for r in $(grep -o '\./[a-z]*/[^"]*' index.html | sort -u); do
            p="${r#./}"; p="${p%%\?*}"
            [ -e "$p" ] || { echo "MISS $r"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "refs OK"

      - name: Single asset version
        run: |
          n=$(grep -rho '?v=[0-9]*' index.html js/ | sort -u | wc -l)
          [ "$n" -eq 1 ] && echo "version OK" || { echo "mixed ?v= versions"; exit 1; }

      - name: Server smoke test
        run: |
          node server.js 8123 &
          srv=$!
          sleep 3
          curl -sf http://127.0.0.1:8123/ -o /dev/null
          curl -sf "http://127.0.0.1:8123/assets/bg-poster.jpg" -o /dev/null
          curl -sf http://127.0.0.1:8123/health | grep -q ok
          kill $srv
          echo "smoke OK"
