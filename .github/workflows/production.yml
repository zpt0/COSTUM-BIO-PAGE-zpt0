name: production
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: zpt0.404.mn

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: domain files
        run: |
          echo "$DOMAIN" > CNAME
          printf 'User-agent: *\nAllow: /\nSitemap: https://%s/sitemap.xml\n' "$DOMAIN" > robots.txt
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' "<url><loc>https://$DOMAIN/</loc><changefreq>weekly</changefreq></url>" '</urlset>' > sitemap.xml
          sed -i 's|<meta property="og:image" content="./assets/bg-poster.jpg" />|<meta property="og:image" content="https://'"$DOMAIN"'/assets/bg-poster.jpg" />|' index.html

      - name: cache-bust versions
        if: github.event_name == 'push'
        run: |
          sed -i -E 's/\?v=[0-9]+/?v=${{ github.run_number }}/g' index.html js/main.js js/config.js js/modules/*.js

      - name: commit back
        run: |
          git config user.name "bio-bot"
          git config user.email "bio-bot@users.noreply.github.com"
          git add CNAME robots.txt sitemap.xml index.html js/
          git diff --cached --quiet && echo "nothing to do" || { git commit -m "chore: production files [skip ci]"; git push; }
